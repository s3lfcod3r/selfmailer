# SelfMailer — Single-Container-Deployment (Backend + gebautes Frontend).
#
# Schnellstart:
#   cp .env.example .env
#   python -c "import secrets; print(secrets.token_hex(32))"   # -> SELFMAILER_SECRET in .env
#   docker compose up -d
#
# Danach http://<host>:8090 öffnen — der erste Aufruf legt das Admin-Konto an.
#
# Fertiges Image statt selbst bauen: die `build`-Zeilen auskommentieren und
# stattdessen `image: ghcr.io/s3lfcod3r/selfmailer:latest` aktivieren.

services:
  selfmailer:
    # Der Dockerfile liegt in backend/, braucht aber das Repo-Root als Context
    # (er kopiert sowohl frontend/ als auch backend/).
    build:
      context: .
      dockerfile: backend/Dockerfile
    # image: ghcr.io/s3lfcod3r/selfmailer:latest
    container_name: selfmailer
    restart: unless-stopped
    # Haertung (seit 1.97.2): die App laeuft als normaler Nutzer auf Port
    # 8090/8443 und braucht keine Linux-Sonderrechte. Ohne sie kann eine Luecke
    # im Code auch keine erlangen (kein setuid, keine Capabilities).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8090:8090"
      # Optional HTTPS direkt im Container (siehe .env.example: SELFMAILER_TLS_*,
      # docs/HTTPS.md). Zertifikate z. B. nach ./data/certs legen.
      # - "8443:8443"
    env_file:
      - .env
    volumes:
      # SQLite-DB, nächtliche Backups und (optional) die FCM-Service-Account-JSON.
      # Der Container läuft NON-ROOT (uid 99 / gid 100 = nobody:users). Gehört der
      # Ordner auf dem Host jemand anderem, kann die DB nicht geschrieben werden —
      # einmalig `sudo chown -R 99:100 ./data` (auf Unraid: Tools -> Docker Safe
      # New Permissions).
      - ./data:/data
      # Optional (seit 1.97.0): Backups auf einen ANDEREN Datenträger legen, damit
      # ein Plattenschaden nicht DB und Backups zugleich trifft. Dazu einkommentieren
      # und in .env SELFMAILER_BACKUP_DIR=/backups setzen. Auch hier gilt:
      # `sudo chown -R 99:100 ./backups` auf dem Host.
      # - /pfad/zum/anderen/datentraeger/selfmailer-backups:/backups
    # Wichtig: ./data enthält Datenbank und Backups. Den Ordner NICHT per SMB/NFS
    # freigeben - Dateirechte (600) schützen nicht gegen Zugriff als derselbe User.
    # Der Healthcheck steckt bereits im Image (GET /api/health, alle 30 s).
