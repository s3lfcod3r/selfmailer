name: CI & Deploy

# Test-Gate VOR dem Deploy: backend-test (pytest + ruff-Lint) und
# frontend-check (tsc Typecheck) müssen GRÜN sein, sonst wird KEIN
# Docker-Image gebaut/gepusht. Der build-Job übernimmt 1:1 die bisherige
# Build/Push-Logik aus docker-image.yml und hängt nur per `needs` an den
# Test-Jobs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Identisch zum Laufzeit-Image (backend/Dockerfile: python:3.13-slim).
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # Blockierend (Lint-Gate): ruff-Config in backend/pyproject.toml
        # (E/F-Regeln, line-length 145). Ein ruff-Fund blockiert den Deploy.
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        # SELFMAILER_SECRET wird von conftest.py via setdefault gesetzt; hier
        # zusätzlich explizit, damit pytest auch ohne conftest-Default läuft.
        env:
          SELFMAILER_SECRET: ci-test-secret-this-is-long-enough-1234567890
        run: pytest -q

      - name: Abhaengigkeiten pruefen (pip-audit)
        # Blockierend seit 1.97.0: als reiner Protokoll-Eintrag blieb die
        # kompromittierte emSign-CA in certifi (PYSEC-2026-4320) wochenlang
        # unbemerkt. Ein bekanntes Advisory stoppt jetzt den Deploy. Neue
        # Advisories ohne Commit meldet security-audit.yml (woechentlich).
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --desc

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Identisch zum Frontend-Build-Stage (backend/Dockerfile: node:24-alpine).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Mail regression tests
        run: npm test

      - name: Abhaengigkeiten pruefen (npm audit)
        # Befund 20: nur Laufzeit-Pakete, Dev-Werkzeuge landen nicht im Image.
        # Blockierend ab "high" (siehe pip-audit oben); "moderate"/"low" stehen
        # nur im Protokoll, damit kosmetische Advisories den Deploy nicht stoppen.
        run: npm audit --omit=dev --audit-level=high

  build:
    # Deploy-Gate: läuft NUR, wenn beide Test-Jobs grün sind.
    needs: [backend-test, frontend-check]
    # Bei Pull Requests nur testen, nicht deployen (kein Push ins Registry).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container runtime smoke test
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          container="selfmailer-smoke-${GITHUB_RUN_ID}"
          volume="selfmailer-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          image="$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"
          docker pull "$image"
          docker volume create "$volume"
          docker run -d --name "$container" -v "$volume:/data" \
            -e SELFMAILER_SECRET=ci-container-synthetic-secret-0123456789 \
            -e SELFMAILER_SYNC_DISABLE=1 -e SELFMAILER_COOKIE_SECURE=false "$image"
          for phase in initial restarted; do
            if [ "$phase" = restarted ]; then docker restart "$container"; fi
            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then docker logs "$container"; exit 1; fi
            docker exec -i -e SMOKE_PHASE="$phase" "$container" python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          assert os.getuid() == 99, "Container must run as UID 99"
          assert not os.access("/app/app/main.py", os.W_OK), "App code must not be writable by the runtime user"
          assert os.access("/data", os.W_OK), "/data must stay writable"
          base = "http://127.0.0.1:8090"
          with urllib.request.urlopen(base + "/api/health") as response:
              health = json.load(response)
              assert health["status"] == "ok" and health["version"]
          with urllib.request.urlopen(base + "/") as response:
              assert response.headers.get("Content-Security-Policy")
              shell = response.read().decode()
          assets = re.findall(r'(?:src|href)="(/assets/[^"<>]+)"', shell)
          assert assets
          for asset in assets:
              with urllib.request.urlopen(base + asset) as response:
                  assert response.status == 200
          request = urllib.request.Request(base + "/api/v1/auth/setup",
              data=json.dumps({"username": "ci-smoke-admin", "password": "synthetic-password-123"}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          if os.environ["SMOKE_PHASE"] == "initial":
              with urllib.request.urlopen(request) as response:
                  assert response.status == 201
          else:
              try:
                  urllib.request.urlopen(request)
                  raise AssertionError("Setup must stay completed after restart")
              except urllib.error.HTTPError as error:
                  assert error.code == 409, error.code
          assert os.path.getsize("/data/selfmailer.db") > 0
          assert os.stat("/data/selfmailer.db").st_mode & 0o077 == 0, "DB must be 600"
          print("PASS", os.environ["SMOKE_PHASE"], health, "UID 99, CSP, assets, persistent setup")
          PY
          done

      - name: Container TLS smoke test (optional HTTPS)
        # Seit 1.97.0: mit SELFMAILER_TLS_CERT/KEY lauscht der Container
        # zusaetzlich HTTPS auf 8443, HTTP auf 8090 bleibt. Geprueft wird:
        # beide Listener antworten, HSTS nur auf HTTPS, Secure-Cookie nur auf
        # HTTPS, und "docker stop" beendet BEIDE Listener zuegig (SIGTERM).
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          container="selfmailer-tls-${GITHUB_RUN_ID}"
          certs="$(mktemp -d)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$certs"' EXIT
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            -keyout "$certs/key.pem" -out "$certs/cert.pem"
          # mktemp -d legt den Ordner mit 700 an - der Container laeuft als uid 99
          # und koennte ihn dann nicht betreten ("TLS-Datei nicht gefunden").
          chmod 755 "$certs"
          chmod 644 "$certs/key.pem" "$certs/cert.pem"
          image="$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"
          docker run -d --name "$container" -v "$certs:/certs:ro" \
            -e SELFMAILER_SECRET=ci-container-synthetic-secret-0123456789 \
            -e SELFMAILER_SYNC_DISABLE=1 -e SELFMAILER_HSTS_MAX_AGE=600 \
            -e SELFMAILER_TLS_CERT=/certs/cert.pem -e SELFMAILER_TLS_KEY=/certs/key.pem "$image"
          healthy=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy ]; then healthy=true; break; fi
            # Bricht der Start ab (z. B. Zertifikat nicht lesbar), nicht 60 s warten.
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then docker logs "$container"; exit 1; fi
          docker exec -i "$container" python - <<'PY'
          import json, ssl, urllib.request
          ctx = ssl.create_default_context(cafile="/certs/cert.pem")
          # Nur der TEST-Client: das openssl-Testzertifikat hat kein keyUsage, was
          # Python 3.13 im Strict-Modus ablehnt. Geprueft wird hier der Server.
          ctx.verify_flags &= ~ssl.VERIFY_X509_STRICT
          def call(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                  headers={"Content-Type": "application/json"}, method="POST" if body else "GET")
              return urllib.request.urlopen(req, context=ctx if url.startswith("https") else None, timeout=5)
          with call("http://127.0.0.1:8090/api/health") as r:
              assert r.status == 200 and not r.headers.get("Strict-Transport-Security")
          with call("https://localhost:8443/api/health") as r:
              assert r.status == 200 and r.headers.get("Strict-Transport-Security") == "max-age=600"
          admin = {"username": "ci-tls-admin", "password": "synthetic-password-123"}
          with call("https://localhost:8443/api/v1/auth/setup", admin) as r:
              assert r.status == 201 and "secure" in r.headers.get("Set-Cookie", "").lower()
          with call("http://127.0.0.1:8090/api/v1/auth/login", admin) as r:
              assert r.status == 200 and "secure" not in r.headers.get("Set-Cookie", "").lower()
          print("PASS TLS: http+https, HSTS only on https, Secure cookie only on https")
          PY
          start=$(date +%s)
          docker stop -t 20 "$container"
          dauer=$(( $(date +%s) - start ))
          echo "docker stop took ${dauer}s"
          if [ "$dauer" -ge 15 ]; then docker logs "$container"; echo "Shutdown too slow - a listener ignored SIGTERM"; exit 1; fi
          if [ "$(docker logs "$container" 2>&1 | grep -c 'Application startup complete')" -ne 1 ]; then
            docker logs "$container"; echo "Lifespan must start exactly once"; exit 1
          fi
